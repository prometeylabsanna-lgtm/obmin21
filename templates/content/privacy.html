{% extends 'base.html' %}

{% block title %}{{ page.seo_title|default:page.title }} · {{ site_settings.site_name }}{% endblock %}
{% block content %}
<article class="detail-page" data-qa="privacy-page">
  <header class="detail-page__header">
    <h1 class="detail-page__title">{{ page.title }}</h1>
  </header>
  <div class="detail-page__panel">
    <div class="detail-page__body">
      {{ page.body|linebreaks }}
    </div>
  </div>
</article>
{% endblock %}
