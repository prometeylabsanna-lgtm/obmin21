{% extends 'base.html' %}
{% load content_format %}

{% block title %}{{ page.seo_title|default:page.title }} · {{ site_settings.site_name }}{% endblock %}
{% block content %}
<article class="simple-page" data-qa="privacy-page">
  <h1 class="simple-page__title">{{ page.title }}</h1>
  <div class="simple-page__body">
    {{ page.body|format_body }}
  </div>
</article>
{% endblock %}
