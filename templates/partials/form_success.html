<div class="modal" role="dialog" aria-modal="true" aria-labelledby="success-title" data-qa="form-success">
  <div class="modal__head">
    <h2 class="modal__title" id="success-title">{{ title }}</h2>
    <button type="button" class="modal__close" data-close-modal aria-label="Закрити">×</button>
  </div>
  <div class="modal__body">
    <p class="modal__message">{{ message }}</p>
    <div class="modal__actions">
      <button type="button" class="btn btn--accent" data-close-modal>Добре</button>
    </div>
  </div>
</div>
