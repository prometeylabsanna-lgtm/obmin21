<div class="modal-backdrop">
  <div class="modal modal--sm" role="dialog" aria-modal="true" aria-labelledby="success-title" data-qa="form-success">
    <button type="button" class="modal__close" data-close-modal aria-label="Закрити">×</button>
    <div class="modal__success">
      <div class="modal__success-icon" aria-hidden="true">
        <svg width="32" height="24" viewBox="0 0 36 28"><path d="M3 14l10 10L33 3" stroke="#fff" fill="none" stroke-width="4"></path></svg>
      </div>
      <h2 class="modal__title" id="success-title" style="margin-top:22px">{{ title|default:"Дякуємо!" }}</h2>
      <p class="modal__lead" style="margin-left:auto;margin-right:auto;max-width:320px">{{ message }}</p>
      <button type="button" class="btn btn--block" style="margin-top:24px" data-close-modal>Закрити</button>
    </div>
  </div>
</div>
