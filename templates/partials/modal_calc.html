<div class="modal-backdrop">
  <div class="modal modal--sm" role="dialog" aria-modal="true" aria-labelledby="calc-title" data-qa="modal-calc">
{% load content_format %}
    <button type="button" class="modal__close" data-close-modal aria-label="Закрити">×</button>
    <div class="modal__step">Калькулятор</div>
    <h2 class="modal__title" id="calc-title">Розрахуйте <span class="accent">обмін</span></h2>
    <p class="modal__lead">Вкажіть суму — побачите скільки отримаєте зараз.</p>
    <div class="modal__body" data-calc data-qa="calc">
      <label class="form__label">Ви віддаєте
        <input type="text" inputmode="decimal" data-calc-amount value="1000" autocomplete="off">
      </label>
      <div class="calc-codes" data-calc-codes style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0">
        {% for row in calc_rows %}
        <button type="button"
                class="btn btn--ghost btn--sm calc-codes__btn{% if forloop.first %} is-active{% endif %}"
                data-calc-code="{{ row.pair.code }}"
                data-buy="{{ row.quote.buy|format_rate:"auto" }}"
                data-sell="{{ row.quote.sell|format_rate:"auto" }}"
                data-pair-id="{{ row.pair.pk }}">{{ row.pair.code }}</button>
        {% endfor %}
      </div>
      <div class="form__label">Ви отримуєте</div>
      <div style="font-size:28px;font-weight:700;margin:8px 0"><span data-calc-result>0</span> UAH</div>
      <div class="u-muted" data-calc-rate-label style="font-size:13px"></div>
      <div class="modal__actions">
        <button type="button" class="btn btn--accent btn--block" data-calc-continue data-qa="calc-continue">Зафіксувати курс</button>
      </div>
    </div>
  </div>
</div>
