{% with tg=site_settings.telegram_url %}
<aside class="sidenav" data-sidenav data-qa="sidenav" aria-label="Бічна навігація">
  {% if tg %}
  <a class="sidenav__item" href="{{ tg }}" target="_blank" rel="noopener noreferrer" title="Telegram" data-qa="sidenav-telegram">
    <span class="sidenav__badge" aria-hidden="true">
      <svg class="sidenav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 3.5 2.8 10.8c-.7.3-.7 1.3.1 1.5l4.7 1.5 1.8 5.5c.2.7 1.1.9 1.6.3l2.6-2.8 4.9 3.6c.6.4 1.5.1 1.7-.6L22.7 4.4c.2-.8-.6-1.4-1.2-.9Z"/><path d="m9.7 13.8 8.6-7.2"/></svg>
    </span>
    <span class="sidenav__label">Telegram</span>
  </a>
  {% endif %}

  <button type="button" class="sidenav__item" data-open-modal="{% url 'leads:calc_modal' %}" title="Калькулятор" data-qa="sidenav-calc">
    <span class="sidenav__badge" aria-hidden="true">
      <svg class="sidenav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M16 15h0M8 19h2M12 19h2M16 19h0"/></svg>
    </span>
    <span class="sidenav__label">Калькулятор</span>
  </button>

  <a class="sidenav__item" href="{% url 'core:home' %}#exchange" data-anchor="exchange" title="Обмін валют">
    <span class="sidenav__badge" aria-hidden="true">
      <svg class="sidenav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h11l-2.5-2.5M17 16H6l2.5 2.5"/><circle cx="12" cy="12" r="2.5"/></svg>
    </span>
    <span class="sidenav__label">Курси</span>
  </a>
  <a class="sidenav__item" href="{% url 'core:home' %}#contacts" data-anchor="contacts" title="Контакти">
    <span class="sidenav__badge" aria-hidden="true">
      <svg class="sidenav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.2"/></svg>
    </span>
    <span class="sidenav__label">Контакти</span>
  </a>
  <a class="sidenav__item" href="{% url 'core:home' %}#services" data-anchor="services" title="Послуги">
    <span class="sidenav__badge" aria-hidden="true">
      <svg class="sidenav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7V5.8A1.8 1.8 0 0 1 9.8 4h4.4A1.8 1.8 0 0 1 16 5.8V7"/><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M4 12h16"/></svg>
    </span>
    <span class="sidenav__label">Послуги</span>
  </a>
  <a class="sidenav__item" href="{% url 'core:home' %}#advantages" data-anchor="advantages" title="Переваги">
    <span class="sidenav__badge" aria-hidden="true">
      <svg class="sidenav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 2.2 4.5 5 .7-3.6 3.5.9 5.1L12 15.9 7.5 17.3l.9-5.1L4.8 8.7l5-.7L12 3.5Z"/></svg>
    </span>
    <span class="sidenav__label">Переваги</span>
  </a>
  <a class="sidenav__item" href="{% url 'core:home' %}#news" data-anchor="news" title="Новини">
    <span class="sidenav__badge" aria-hidden="true">
      <svg class="sidenav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h11a2 2 0 0 1 2 2v12H7a2 2 0 0 1-2-2V5Z"/><path d="M18 8h1a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/><path d="M8 9h6M8 13h6M8 17h4"/></svg>
    </span>
    <span class="sidenav__label">Новини</span>
  </a>
  <a class="sidenav__item" href="{% url 'core:home' %}#seo-block" data-anchor="seo-block" title="Інформація">
    <span class="sidenav__badge" aria-hidden="true">
      <svg class="sidenav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 8h.01"/></svg>
    </span>
    <span class="sidenav__label">Інфо</span>
  </a>

  <div class="sidenav__social">
    {% if site_settings.youtube_url %}
    <a class="sidenav__item" href="{{ site_settings.youtube_url }}" target="_blank" rel="noopener noreferrer" title="YouTube">
      <span class="sidenav__badge" aria-hidden="true">
        <svg class="sidenav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="3"/><path d="m10 10 5 2-5 2v-4Z"/></svg>
      </span>
    </a>
    {% endif %}
    {% if site_settings.instagram_url %}
    <a class="sidenav__item" href="{{ site_settings.instagram_url }}" target="_blank" rel="noopener noreferrer" title="Instagram">
      <span class="sidenav__badge" aria-hidden="true">
        <svg class="sidenav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.2" cy="6.8" r="0.8" fill="currentColor" stroke="none"/></svg>
      </span>
    </a>
    {% endif %}
    {% if site_settings.facebook_url %}
    <a class="sidenav__item" href="{{ site_settings.facebook_url }}" target="_blank" rel="noopener noreferrer" title="Facebook">
      <span class="sidenav__badge" aria-hidden="true">
        <svg class="sidenav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8h2V5h-2c-2.2 0-4 1.8-4 4v2H8v3h2v6h3v-6h2.2l.8-3H13V9c0-.6.4-1 1-1Z"/></svg>
      </span>
    </a>
    {% endif %}
  </div>
</aside>
{% endwith %}
