<div class="site-header__actions" id="city-chrome">
  <div class="city-select" data-city-select>
    <button type="button" class="city-select__btn" data-city-toggle data-qa="city-toggle" data-city-slug="{{ active_city.slug }}" aria-expanded="false" aria-haspopup="listbox">
      <svg class="city-select__pin" width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><path d="M6 0a5 5 0 0 0-5 5c0 3.6 5 9 5 9s5-5.4 5-9a5 5 0 0 0-5-5zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="var(--color-accent)"></path></svg>
      <span data-city-label>{{ active_city.name|default:"Місто" }}</span>
      <svg class="city-select__chevron" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="#B3B4B6" fill="none" stroke-width="1.4"></path></svg>
    </button>
    <div class="city-select__menu" data-city-menu hidden role="listbox">
      {% for c in cities %}
      <form method="post" action="{% url 'network:set_city' %}"
            hx-post="{% url 'network:set_city' %}"
            hx-target="#city-chrome"
            hx-swap="outerHTML">
        {% csrf_token %}
        <input type="hidden" name="city" value="{{ c.slug }}">
        <button type="submit" class="city-select__option{% if active_city.slug == c.slug %} is-active{% endif %}" data-qa="city-option">
          <span>{{ c.name }}</span>
          <svg width="6" height="10" viewBox="0 0 6 10" aria-hidden="true"><path d="M1 1l4 4-4 4" stroke="var(--color-accent)" fill="none" stroke-width="1.4"></path></svg>
        </button>
      </form>
      {% endfor %}
    </div>
  </div>

  {% if active_phone and phone_href %}
  <a class="site-header__phone" href="tel:{{ phone_href }}" data-qa="phone" id="header-phone">
    <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="var(--color-accent)"></path></svg>
    {{ active_phone }}
  </a>
  {% endif %}

  <button type="button" class="btn btn--accent site-header__cta" data-open-modal="{% url 'leads:request_modal' %}" data-qa="cta-request">
    Забронювати заявку
  </button>

  <button
    type="button"
    class="site-header__menu-toggle"
    data-menu-toggle
    aria-label="Меню"
    aria-expanded="false"
    aria-controls="mobile-nav"
    data-qa="menu-toggle"
  >
    <span></span>
    <span></span>
  </button>
</div>
