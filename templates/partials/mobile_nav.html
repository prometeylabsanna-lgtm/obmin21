{% load responsive %}
<div
  class="mobile-menu"
  id="mobile-nav"
  data-menu-drawer
  data-theme="header"
  hidden
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-label="Меню сайту"
>
  <div class="mobile-menu__top">
    <a href="{% url 'core:home' %}" class="mobile-menu__logo">
      {% if site_settings.header_logo %}
      <img src="{{ site_settings.header_logo.url }}" alt="{% if site_settings.logo_text %}{{ site_settings.logo_text }}{{ site_settings.logo_accent }}{% else %}{{ site_settings.site_name }}{% endif %}" width="{{ site_settings.header_logo.width }}" height="{{ site_settings.header_logo.height }}" decoding="async">
      {% else %}
      <img src="{% static_img 'images/logo.png' %}" alt="{% if site_settings.logo_text %}{{ site_settings.logo_text }}{{ site_settings.logo_accent }}{% else %}{{ site_settings.site_name }}{% endif %}" {% img_wh 'images/logo.png' %} decoding="async">
      {% endif %}
    </a>
    <button type="button" class="mobile-menu__close" data-menu-close aria-label="Закрити меню" data-qa="menu-close">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 2l18 18M20 2L2 20" stroke="#fff" stroke-width="2"></path></svg>
    </button>
  </div>

  <nav class="mobile-menu__nav" aria-label="Мобільне меню">
    {% if header_menu %}{% for item in header_menu %}{% if item.show_mobile %}<a data-mi href="{{ item.href }}"{% if item.is_current %} aria-current="page"{% endif %}{% if item.new_tab %} target="_blank" rel="noopener"{% endif %}>{{ item.label }}</a>{% endif %}{% endfor %}{% else %}
    <a data-mi href="{% url 'content:services' %}">Послуги</a>
    <a data-mi href="{% url 'content:advantages' %}">Переваги</a>
    <a data-mi href="{% url 'content:faq' %}">FAQ</a>
    <a data-mi href="{% url 'blog:post_list' %}">Блог</a>
    <a data-mi href="{% url 'content:contacts' %}">Контакти</a>
    {% endif %}
  </nav>

  {% include 'partials/mobile_contacts.html' %}
</div>
