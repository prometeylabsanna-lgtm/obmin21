{% load static %}
<div
  class="mobile-menu"
  id="mobile-nav"
  data-menu-drawer
  data-theme="header"
  hidden
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-label="Меню сайту"
>
  <div class="mobile-menu__top">
    <a href="{% url 'core:home' %}" class="mobile-menu__logo">
      {% if site_settings.header_logo %}
      <img src="{{ site_settings.header_logo.url }}" alt="{{ site_settings.site_name }}" width="140" height="40">
      {% else %}
      <img src="{% static 'images/logo.png' %}" alt="{{ site_settings.site_name }}" width="140" height="40">
      {% endif %}
    </a>
    <button type="button" class="mobile-menu__close" data-menu-close aria-label="Закрити меню" data-qa="menu-close">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 2l18 18M20 2L2 20" stroke="#fff" stroke-width="2"></path></svg>
    </button>
  </div>

  <nav class="mobile-menu__nav" aria-label="Мобільне меню">
    <a data-mi href="{% url 'content:services' %}">Послуги<img src="{% static 'images/bitcoin.png' %}" alt="" width="40" height="40"></a>
    <a data-mi href="{% url 'content:advantages' %}">Переваги<img src="{% static 'images/bitcoin.png' %}" alt="" width="40" height="40"></a>
    <a data-mi href="{% url 'content:faq' %}">FAQ<img src="{% static 'images/bitcoin.png' %}" alt="" width="40" height="40"></a>
    <a data-mi href="{% url 'blog:post_list' %}">Блог<img src="{% static 'images/bitcoin.png' %}" alt="" width="40" height="40"></a>
    <a data-mi href="{% url 'content:contacts' %}">Контакти<img src="{% static 'images/bitcoin.png' %}" alt="" width="40" height="40"></a>
  </nav>

  <div class="mobile-menu__bottom">
    {% if active_phone %}
    <a class="mobile-menu__phone" href="tel:{{ active_phone|cut:' '|cut:'('|cut:')'|cut:'-' }}">
      <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="var(--color-accent)"></path></svg>
      {{ active_phone }}
    </a>
    {% endif %}
    <button type="button" class="btn btn--accent btn--block" data-open-modal="{% url 'leads:request_modal' %}" data-menu-close>
      Забронювати заявку
    </button>
  </div>
</div>
