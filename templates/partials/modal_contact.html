{% load i18n %}
<div class="modal-backdrop">
  <div class="modal modal--sm contact-modal" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title" data-qa="modal-contact">
    <button type="button" class="modal__close" data-close-modal aria-label="{% translate 'Close' %}">
      <svg class="contact-modal__close-icon" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
        <path d="M1 1l8 8M9 1L1 9"></path>
      </svg>
    </button>
    <h2 class="modal__title" id="contact-modal-title">
      {% if modal_title %}{{ modal_title }}{% if modal_accent %} <span class="accent">{{ modal_accent }}</span>{% endif %}{% else %}{% translate "Зв’язатися" %}{% endif %}
    </h2>
    <div class="contact-modal__list">
      {% include 'partials/contact_form.html' %}
    </div>
  </div>
</div>
