{% extends 'base.html' %}
{% load static content_format %}

{% block title %}{{ page_title }} · {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="page-hero blog-hero">
  <h1 class="page-hero__title">Корисні <span class="u-accent">статті</span></h1>
  <div class="blog-filters">
    <a class="{% if not active_category %}is-active{% endif %}" href="{% url 'blog:post_list' %}">Усі</a>
    {% for cat in categories %}
    <a class="{% if active_category.slug == cat.slug %}is-active{% endif %}" href="{% url 'blog:category' cat.slug %}">{{ cat.name }}</a>
    {% endfor %}
  </div>
</section>

{% include 'partials/blog_list.html' %}
{% endblock %}
